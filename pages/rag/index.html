<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>增强 RAG 知识库</title>
  <style>
    :root {
      --bg: #f7f8fa; --card: #ffffff; --text: #1f2329; --muted: #6b7280;
      --border: #e5e7eb; --accent: #4f6ef7; --accent-text: #ffffff;
      --danger: #e5484d; --ok: #30a46c; --warn: #f5a623; --drop: rgba(79,110,247,.08);
    }
    html[data-theme="dark"] {
      --bg: #14161a; --card: #1e2126; --text: #e6e8ec; --muted: #9aa0a8;
      --border: #2c3037; --accent: #6b8afd; --drop: rgba(107,138,253,.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto; padding: 20px; max-width: 800px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.6;
    }
    h1 { font-size: 18px; margin: 0 0 16px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; margin-bottom: 16px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label { color: var(--muted); font-size: 12px; }
    input[type=text], input[type=password], input[type=number], select {
      padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 14px;
    }
    input[type=text] { min-width: 160px; }
    button {
      padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre, .result-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; margin: 8px 0; white-space: pre-wrap; word-break: break-word;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      font-size: 12px; background: var(--border); color: var(--muted);
    }
    .badge.ok { background: rgba(48,164,108,.15); color: var(--ok); }
    .badge.warn { background: rgba(245,166,35,.15); color: var(--warn); }
    .badge.err { background: rgba(229,72,77,.15); color: var(--danger); }
    .status { margin-top: 8px; min-height: 20px; color: var(--muted); }

    /* 顶部子页 Tab */
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); cursor: pointer; font-size: 14px;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .panel { display: none; }
    .panel.active { display: block; }

    /* 知识库列表 */
    .kb-list { display: flex; flex-direction: column; gap: 8px; }
    .kb-item {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    }
    .kb-item.selected { border-color: var(--accent); background: var(--drop); }
    .kb-name { font-weight: 600; min-width: 120px; }
    .kb-stats { color: var(--muted); font-size: 12px; flex: 1; }

    /* 默认聚合库勾选 */
    .kb-check { display: flex; gap: 10px; flex-wrap: wrap; }
    .kb-check label {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      color: var(--text); font-size: 13px;
    }
    .kb-check label.checked { border-color: var(--accent); background: var(--drop); }
    .kb-check input { width: 15px; height: 15px; }

    /* 拖拽上传区 */
    .dropzone {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 26px 16px; text-align: center; color: var(--muted);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .dropzone.dragover { border-color: var(--accent); background: var(--drop); color: var(--accent); }

    /* 文档列表 */
    .doc-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-bottom: 1px solid var(--border);
    }
    .doc-item:last-child { border-bottom: none; }
    .doc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-size { color: var(--muted); font-size: 12px; white-space: nowrap; }

    /* 悬浮窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; max-width: 640px; width: calc(100% - 40px);
      max-height: 86vh; overflow-y: auto; padding: 18px 20px;
    }
    .modal h3 { margin: 0 0 12px; font-size: 16px; }
    .modal .close-x {
      float: right; border: none; background: none; color: var(--muted);
      font-size: 20px; cursor: pointer; padding: 0 4px;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .modal-msg { white-space: pre-wrap; word-break: break-word; margin: 4px 0 16px; }

    /* 配置表单 */
    fieldset {
      border: 1px solid var(--border); border-radius: 8px;
      margin: 0 0 14px; padding: 12px 14px;
    }
    legend { padding: 0 6px; font-weight: 600; color: var(--accent); }
    .cfg-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .cfg-row label { flex: 0 0 190px; color: var(--text); font-size: 13px; }
    .cfg-row input[type=text], .cfg-row input[type=password], .cfg-row input[type=number] { flex: 1; min-width: 200px; }
    .cfg-desc { flex-basis: 100%; color: var(--muted); font-size: 12px; margin: -4px 0 4px 200px; }
    .cfg-row input[type=checkbox] { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <h1>增强 RAG 知识库</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="kb">知识库管理</button>
    <button class="tab-btn" data-tab="search">检索</button>
    <button class="tab-btn" data-tab="config">配置</button>
  </div>

  <!-- ============ 知识库管理 ============ -->
  <div class="panel active" id="panel-kb">
    <div class="card">
      <h2>知识库列表</h2>
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="new-kb" placeholder="新知识库 ID">
        <button class="primary" id="btn-kb-create">新建知识库</button>
        <button id="btn-kb-refresh">刷新列表</button>
      </div>
      <div id="kb-list" class="kb-list status">加载中…</div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 style="flex:1">默认聚合检索知识库</h2>
        <button class="primary" id="btn-defaults-save">保存默认</button>
      </div>
      <div class="meta" style="margin-bottom:8px">检索页将默认勾选这些知识库；检索时可临时调整。</div>
      <div id="defaults-kbs" class="kb-check status">加载中…</div>
      <div id="defaults-status" class="status"></div>
    </div>
  </div>

  <!-- ============ 检索 ============ -->
  <div class="panel" id="panel-search">
    <div class="card">
      <h2>选择知识库（可多选）</h2>
      <div id="search-kbs" class="kb-check status">加载中…</div>
    </div>
    <div class="card">
      <div class="row">
        <input type="text" id="query" placeholder="输入问题，跨知识库检索…" style="flex:1">
        <label>保留数量</label>
        <input type="number" id="top-n" min="1" max="30" value="6" style="width:80px">
        <button class="primary" id="btn-search">检索</button>
      </div>
      <div id="search-status" class="status"></div>
      <div id="results"></div>
    </div>
  </div>

  <!-- ============ 配置 ============ -->
  <div class="panel" id="panel-config">
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 style="flex:1">配置</h2>
        <button class="primary" id="btn-config-save">保存配置</button>
      </div>
      <div id="config-form"></div>
      <div id="config-status" class="status"></div>
    </div>
  </div>

  <!-- ============ 知识库配置悬浮窗 ============ -->
  <div class="modal-overlay" id="modal-kb">
    <div class="modal">
      <button class="close-x" id="kb-modal-close">×</button>
      <h3 id="kb-modal-title">知识库</h3>
      <div id="kb-modal-status" class="status"></div>
      <div class="row" style="margin:10px 0">
        <button class="primary" id="kb-modal-rebuild">重建索引</button>
        <button class="danger" id="kb-modal-drop-index">删除索引</button>
      </div>
      <h2>上传文档</h2>
      <div class="dropzone" id="dropzone">
        拖拽文件到此处，或点击选择（txt / md / pdf / 图片，可多选）
      </div>
      <input type="file" id="files" multiple accept=".txt,.md,.markdown,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif" style="display:none">
      <div id="pending-files" class="status" style="display:none"></div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="btn-upload">开始上传</button>
        <button id="btn-upload-clear">清空</button>
      </div>
      <div id="upload-status" class="status"></div>
      <h2 style="margin-top:14px">文档列表</h2>
      <div id="documents" class="status">未加载</div>
      <div id="modal-progress" class="status" style="display:none"></div>
    </div>
  </div>

  <!-- ============ 确认弹窗 ============ -->
  <div class="modal-overlay" id="modal-confirm">
    <div class="modal" style="max-width:420px">
      <h3 id="confirm-title">确认</h3>
      <div class="modal-msg" id="confirm-msg"></div>
      <div class="modal-actions">
        <button id="confirm-cancel">取消</button>
        <button class="danger" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Bridge SDK 由 dashboard 在文档末尾注入，晚于本页内联脚本执行，
      // 因此必须先轮询等待 window.AstrBotPluginPage 出现（与官方页面一致）。
      function waitForBridge(timeoutMs) {
        return new Promise(function (resolve, reject) {
          const started = Date.now();
          (function tick() {
            if (window.AstrBotPluginPage) return resolve(window.AstrBotPluginPage);
            if (Date.now() - started > (timeoutMs || 15000)) {
              return reject(new Error("bridge 加载超时，请刷新页面"));
            }
            setTimeout(tick, 50);
          })();
        });
      }

      const $ = (id) => document.getElementById(id);
      const GROUP_TITLES = {
        general: "基础", qdrant: "Qdrant 存储", embedding: "文本 Embedding",
        rerank: "Reranker", chunking: "分块", retrieval: "检索", image: "图片检索",
      };
      let bridge = null;
      let kbs = [];
      let modalKb = null;
      let selectedKb = null;   // 当前选中的知识库（上传目标，服务端同步）
      let defaultKb = null;    // 默认知识库 ID（default_kb_id 配置）
      let searchKbs = new Set();
      let defaultsKbs = new Set();
      let schema = {};
      let groups = [];
      let groupMembers = {};
      let configValues = {};

      function setStatus(el, text, ok) {
        const node = $(el);
        node.textContent = text;
        node.style.color = ok === false ? "var(--danger)" : ok === true ? "var(--ok)" : "var(--muted)";
      }

      function esc(s) {
        const div = document.createElement("div");
        div.textContent = s == null ? "" : String(s);
        return div.innerHTML;
      }

      function fmtSize(bytes) {
        if (bytes == null) return "";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      // ---------- 确认弹窗（沙箱无 allow-modals，原生 confirm 静默失败） ----------
      let confirmCallback = null;
      function confirmDialog(title, message, onOk) {
        $("confirm-title").textContent = title || "确认";
        $("confirm-msg").textContent = message || "";
        confirmCallback = onOk;
        $("modal-confirm").classList.add("open");
      }
      $("confirm-ok").addEventListener("click", () => {
        $("modal-confirm").classList.remove("open");
        const cb = confirmCallback;
        confirmCallback = null;
        if (cb) cb();
      });
      $("confirm-cancel").addEventListener("click", () => {
        $("modal-confirm").classList.remove("open");
        confirmCallback = null;
      });
      $("modal-confirm").addEventListener("click", (e) => {
        if (e.target === $("modal-confirm")) { $("modal-confirm").classList.remove("open"); confirmCallback = null; }
      });

      // ---------- 子页切换 ----------
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
          document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + btn.dataset.tab));
          if (btn.dataset.tab === "search") applyDefaultsToSearch();
        });
      });

      // ---------- 知识库列表 ----------
      function renderKbList() {
        if (!kbs.length) { $("kb-list").textContent = "（暂无知识库，可新建）"; return; }
        $("kb-list").innerHTML = kbs.map((kb) => {
          const cls = kb.status === "READY" ? "ok" : kb.status === "FAILED" ? "err" : "warn";
          const sel = kb.kb_id === selectedKb;
          return `<div class="kb-item ${sel ? "selected" : ""}" data-kb="${esc(kb.kb_id)}">
            <span class="kb-name">${esc(kb.kb_id)}${sel ? ' <span class="badge ok">当前</span>' : ""}</span>
            <span class="badge ${cls}">${esc(kb.status)}</span>
            <span class="kb-stats">v${kb.active_version ?? "-"} · 文档 ${kb.document_count} · 块 ${kb.chunk_count}</span>
            <button class="primary" data-act="config">配置</button>
            <button data-act="drop-index">删除索引</button>
            <button class="danger" data-act="delete">删除</button>
          </div>`;
        }).join("");
        $("kb-list").querySelectorAll(".kb-item").forEach((item) => {
          const kbId = item.dataset.kb;
          item.querySelector('[data-act="config"]').addEventListener("click", () => openKbModal(kbId));
          item.querySelector('[data-act="drop-index"]').addEventListener("click", () => dropIndex(kbId));
          item.querySelector('[data-act="delete"]').addEventListener("click", () => deleteKb(kbId));
        });
      }

      async function refreshKbs() {
        $("kb-list").textContent = "加载中…";
        try {
          kbs = await bridge.apiGet("list") || [];
          renderKbList();
          renderDefaultChecks();
        } catch (e) {
          $("kb-list").textContent = "列表加载失败: " + e;
        }
      }

      async function createKb() {
        const kbId = $("new-kb").value.trim();
        if (!kbId) { setStatus("kb-list", "请输入知识库 ID", false); return; }
        try {
          await bridge.apiPost("kb/create", { kb_id: kbId });
          setStatus("kb-list", `已创建知识库「${kbId}」`, true);
          $("new-kb").value = "";
          // 新建后自动选中该库（上传目标与列表高亮）
          selectedKb = kbId;
          await bridge.apiPost("kb/select", { kb_id: kbId }).catch(() => {});
          refreshKbs();
          loadDefaults();
        } catch (e) {
          setStatus("kb-list", "创建失败: " + e, false);
        }
      }

      function deleteKb(kbId) {
        confirmDialog("删除知识库", `确定删除知识库「${kbId}」？将删除其全部索引与本地文档，且不可恢复。`, async () => {
          try {
            await bridge.apiPost("kb/delete", { kb_id: kbId });
            setStatus("kb-list", `已删除知识库「${kbId}」`, true);
            if (selectedKb === kbId) {
              selectedKb = defaultKb;
              if (selectedKb) bridge.apiPost("kb/select", { kb_id: selectedKb }).catch(() => {});
            }
            refreshKbs();
            loadDefaults();
          } catch (e) {
            setStatus("kb-list", "删除失败: " + e, false);
          }
        });
      }

      function dropIndex(kbId) {
        confirmDialog("删除索引", `确定删除知识库「${kbId}」的索引？知识库和文档列表会保留，下次导入/重建时自动重新构建。`, async () => {
          try {
            await bridge.apiPost("kb/index/delete", { kb_id: kbId });
            setStatus("kb-list", `已删除「${kbId}」的索引`, true);
            refreshKbs();
            if (modalKb === kbId) loadKbModal();
          } catch (e) {
            setStatus("kb-list", "删除索引失败: " + e, false);
          }
        });
      }

      // ---------- 知识库配置悬浮窗 ----------
      function openKbModal(kbId) {
        modalKb = kbId;
        // 打开配置窗同时选中该库（上传目标 + 列表高亮）；切换库时清空待传列表
        selectedKb = kbId;
        renderKbList();
        if (pendingFiles.length) {
          pendingFiles = [];
          renderPendingList();
        }
        $("kb-modal-title").textContent = "知识库「" + kbId + "」";
        $("kb-modal-status").textContent = "加载中…";
        $("documents").textContent = "未加载";
        $("upload-status").textContent = "";
        $("modal-progress").style.display = "none";
        $("modal-kb").classList.add("open");
        bridge.apiPost("kb/select", { kb_id: kbId }).catch(() => {});
        loadKbModal();
        pollModalProgress();
      }
      $("kb-modal-close").addEventListener("click", () => {
        $("modal-kb").classList.remove("open");
        modalKb = null;
      });
      $("modal-kb").addEventListener("click", (e) => {
        if (e.target === $("modal-kb")) { $("modal-kb").classList.remove("open"); modalKb = null; }
      });

      async function loadKbModal() {
        if (!modalKb) return;
        setStatus("kb-modal-status", "加载中…");
        try {
          const data = await bridge.apiGet("status", { kb_id: modalKb });
          const lines = [`活动版本: ${data.active_version ? "v" + data.active_version : "无（未构建索引）"}`];
          if (data.config_changed) lines.push("⚠ 配置已变更，需要重建索引");
          for (const [v, m] of Object.entries(data.versions || {})) {
            const cls = m.status === "READY" ? "ok" : m.status === "FAILED" ? "err" : "warn";
            lines.push(`v${v} [<span class="badge ${cls}">${esc(m.status)}</span>] 文档 ${m.document_count} · 块 ${m.chunk_count}${m.error ? " · " + esc(m.error) : ""}`);
          }
          $("kb-modal-status").innerHTML = lines.map((l) => `<div>${l}</div>`).join("");
          loadDocuments();
        } catch (e) {
          setStatus("kb-modal-status", "状态获取失败: " + e, false);
        }
      }
      $("kb-modal-rebuild").addEventListener("click", async () => {
        if (!modalKb) return;
        setStatus("kb-modal-status", "正在触发重建…");
        try {
          const data = await bridge.apiPost("rebuild", { kb_id: modalKb });
          setStatus("kb-modal-status", "重建完成: " + JSON.stringify(data), true);
          loadKbModal();
          refreshKbs();
        } catch (e) {
          setStatus("kb-modal-status", "重建失败: " + e, false);
        }
      });
      $("kb-modal-drop-index").addEventListener("click", () => {
        if (modalKb) dropIndex(modalKb);
      });

      let progressPollActive = false;
      async function pollModalProgress() {
        if (!modalKb || progressPollActive) return;
        progressPollActive = true;
        try {
          const data = await bridge.apiGet("progress", { kb_id: modalKb });
          const p = data && data.progress;
          const q = (data && data.queue) || {};
          const buildActive = p && p.status && p.status !== "idle";
          const queueActive = (q.running || 0) > 0 || (q.queued || 0) > 0;
          if (buildActive || queueActive) {
            const parts = [];
            if (buildActive) {
              parts.push(
                `构建: ${p.status} · ${p.processed_documents}/${p.total_documents} 文档 · ${p.processed_chunks} 块` +
                (p.error ? " · " + p.error : "")
              );
            }
            if (queueActive) {
              parts.push(`索引队列: 运行 ${q.running || 0} · 等待 ${q.queued || 0} · 完成 ${q.completed || 0}（并发上限 ${q.max_concurrent || "-"}）`);
            }
            $("modal-progress").style.display = "block";
            $("modal-progress").textContent = parts.join("；");
            setTimeout(pollModalProgress, 2000);
          } else {
            $("modal-progress").style.display = "none";
            progressPollActive = false;
          }
        } catch (e) {
          progressPollActive = false; /* ignore transient polling errors */
        }
      }

      // ---------- 上传（待传列表 → 分批上传 → 后端限并发索引） ----------
      const UPLOAD_BATCH = 3;  // 每批并发上传的文件数
      let pendingFiles = [];   // [{file, status: pending|uploading|indexed|error, error}]
      let uploadBusy = false;

      function addPendingFiles(files) {
        const list = Array.from(files || []);
        for (const file of list) {
          const dup = pendingFiles.some((p) => p.file.name === file.name && p.file.size === file.size);
          if (!dup) pendingFiles.push({ file, status: "pending", error: "" });
        }
        renderPendingList();
        $("files").value = "";
      }

      function renderPendingList() {
        const container = $("pending-files");
        const btn = $("btn-upload");
        const btnClear = $("btn-upload-clear");
        const pendingCount = pendingFiles.filter((p) => p.status === "pending").length;
        if (!pendingFiles.length) {
          container.style.display = "none";
          container.innerHTML = "";
        } else {
          container.style.display = "block";
          container.innerHTML = pendingFiles.map((p, i) => {
            const chip = p.status === "pending" ? "待上传"
              : p.status === "uploading" ? "上传中…"
              : p.status === "indexed" ? "已索引"
              : "失败";
            const chipCls = p.status === "indexed" ? "badge ok"
              : p.status === "error" ? "badge err" : "badge warn";
            const removeBtn = (p.status === "pending" || p.status === "error")
              ? `<button class="danger" data-remove="${i}" title="${esc(p.error || "移除")}">移除</button>` : "";
            return `<div class="doc-item">
              <span class="doc-name">${esc(p.file.name)}</span>
              <span class="doc-size">${fmtSize(p.file.size)}</span>
              <span class="${chipCls}">${chip}</span>
              ${removeBtn}
            </div>`;
          }).join("");
          container.querySelectorAll("button[data-remove]").forEach((btnEl) => {
            btnEl.addEventListener("click", () => {
              pendingFiles.splice(Number(btnEl.dataset.remove), 1);
              renderPendingList();
            });
          });
        }
        btn.disabled = pendingCount === 0 || uploadBusy;
        btn.textContent = pendingCount ? `开始上传（${pendingCount}）` : "开始上传";
        btnClear.disabled = uploadBusy;
      }

      async function startUpload() {
        if (uploadBusy || !modalKb) return;
        const queue = pendingFiles.filter((p) => p.status === "pending");
        if (!queue.length) return;
        uploadBusy = true;
        renderPendingList();
        setStatus("upload-status", `开始上传 ${queue.length} 个文件到「${modalKb}」…`);
        let ok = 0;
        for (let start = 0; start < queue.length; start += UPLOAD_BATCH) {
          const batch = queue.slice(start, start + UPLOAD_BATCH);
          batch.forEach((item) => { item.status = "uploading"; });
          renderPendingList();
          await Promise.all(batch.map(async (item) => {
            try {
              await bridge.upload("ingest", item.file);
              item.status = "indexed";
              ok++;
            } catch (e) {
              item.status = "error";
              item.error = String(e);
            }
          }));
          renderPendingList();
          const done = Math.min(start + UPLOAD_BATCH, queue.length);
          setStatus("upload-status", `进度 ${done}/${queue.length}…（后端按并发限制排队索引，见下方队列状态）`);
          pollModalProgress();
        }
        setStatus("upload-status", `完成：${ok}/${queue.length} 个文件已上传并索引`, ok === queue.length);
        uploadBusy = false;
        renderPendingList();
        pollModalProgress();
        loadKbModal();
        refreshKbs();
      }
      $("btn-upload").addEventListener("click", startUpload);
      $("btn-upload-clear").addEventListener("click", () => {
        if (uploadBusy) return;
        pendingFiles = [];
        renderPendingList();
        setStatus("upload-status", "", true);
      });

      function setupDropzone() {
        const zone = $("dropzone");
        const input = $("files");
        zone.addEventListener("click", () => input.click());
        input.addEventListener("change", () => addPendingFiles(input.files));
        ["dragenter", "dragover"].forEach((evt) => {
          zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add("dragover"); });
        });
        ["dragleave", "drop"].forEach((evt) => {
          zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove("dragover"); });
        });
        zone.addEventListener("drop", (e) => {
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
            addPendingFiles(e.dataTransfer.files);
          }
        });
      }

      // ---------- 文档列表 ----------
      async function loadDocuments() {
        if (!modalKb) return;
        $("documents").textContent = "加载中…";
        try {
          const data = await bridge.apiGet("kb/documents", { kb_id: modalKb });
          const docs = data.documents || [];
          if (!docs.length) { $("documents").textContent = "（空）"; return; }
          $("documents").innerHTML = docs.map((d) => `
            <div class="doc-item">
              <span class="doc-name">${esc(d.filename)}</span>
              <span class="badge ${d.indexed ? "ok" : "warn"}">${d.indexed ? "已索引" : "未索引"}</span>
              <span class="doc-size">${fmtSize(d.size)} · ${d.chunks || 0} 块</span>
              <button class="danger" data-doc="${esc(d.filename)}">删除</button>
            </div>`).join("");
          $("documents").querySelectorAll("button[data-doc]").forEach((btn) => {
            btn.addEventListener("click", () => deleteDocument(btn.getAttribute("data-doc")));
          });
        } catch (e) {
          $("documents").textContent = "文档列表加载失败: " + e;
        }
      }

      function deleteDocument(filename) {
        confirmDialog("删除文档", `确定从知识库「${modalKb}」删除文档「${filename}」？`, async () => {
          try {
            await bridge.apiPost("kb/document/delete", { kb_id: modalKb, filename });
            setStatus("upload-status", `已删除文档「${filename}」`, true);
            loadDocuments();
            loadKbModal();
            refreshKbs();
          } catch (e) {
            setStatus("upload-status", "删除失败: " + e, false);
          }
        });
      }

      // ---------- 默认聚合检索知识库 ----------
      async function loadDefaults() {
        try {
          const data = await bridge.apiGet("kb/defaults");
          defaultsKbs = new Set(data.kb_ids || []);
          defaultKb = data.default_kb || null;
          // 默认选中：服务端当前选中库优先，其次默认知识库
          if (selectedKb !== data.selected_kb && data.selected_kb) {
            selectedKb = data.selected_kb;
          } else if (!selectedKb && defaultKb) {
            selectedKb = defaultKb;
            bridge.apiPost("kb/select", { kb_id: selectedKb }).catch(() => {});
          }
          renderDefaultChecks();
          renderKbList();
        } catch (e) {
          $("defaults-kbs").textContent = "加载失败: " + e;
        }
      }

      function renderDefaultChecks() {
        const container = $("defaults-kbs");
        if (!kbs.length) { container.textContent = "（暂无知识库）"; return; }
        container.innerHTML = kbs.map((kb) => `
          <label class="${defaultsKbs.has(kb.kb_id) ? "checked" : ""}" data-kb="${esc(kb.kb_id)}">
            <input type="checkbox" ${defaultsKbs.has(kb.kb_id) ? "checked" : ""}> ${esc(kb.kb_id)}
          </label>`).join("");
        container.querySelectorAll("label[data-kb]").forEach((label) => {
          label.addEventListener("click", () => {
            const kbId = label.dataset.kb;
            if (defaultsKbs.has(kbId)) defaultsKbs.delete(kbId);
            else defaultsKbs.add(kbId);
            label.classList.toggle("checked", defaultsKbs.has(kbId));
          });
        });
      }
      $("btn-defaults-save").addEventListener("click", async () => {
        try {
          const data = await bridge.apiPost("kb/defaults", { kb_ids: Array.from(defaultsKbs) });
          const ids = data.kb_ids || [];
          setStatus("defaults-status", ids.length ? "已保存默认库: " + ids.join(", ") : "已保存（默认不启用任何知识库）", true);
        } catch (e) {
          setStatus("defaults-status", "保存失败: " + e, false);
        }
      });

      // ---------- 多知识库检索 ----------
      function applyDefaultsToSearch() {
        if (searchKbs.size) return;
        searchKbs = new Set(defaultsKbs);
        renderSearchChecks();
      }

      function renderSearchChecks() {
        const container = $("search-kbs");
        if (!kbs.length) { container.textContent = "（暂无知识库）"; return; }
        container.innerHTML = kbs.map((kb) => `
          <label class="${searchKbs.has(kb.kb_id) ? "checked" : ""}" data-kb="${esc(kb.kb_id)}">
            <input type="checkbox" ${searchKbs.has(kb.kb_id) ? "checked" : ""}> ${esc(kb.kb_id)}
          </label>`).join("");
        container.querySelectorAll("label[data-kb]").forEach((label) => {
          label.addEventListener("click", () => {
            const kbId = label.dataset.kb;
            if (searchKbs.has(kbId)) searchKbs.delete(kbId);
            else searchKbs.add(kbId);
            label.classList.toggle("checked", searchKbs.has(kbId));
          });
        });
      }

      async function search() {
        const q = $("query").value.trim();
        if (!q) return;
        const kbIds = Array.from(searchKbs);
        if (!kbIds.length) { setStatus("search-status", "请先选择至少一个知识库", false); return; }
        const topN = Math.max(1, Math.min(30, Number($("top-n").value) || 6));
        setStatus("search-status", "检索中…");
        $("results").innerHTML = "";
        try {
          const data = await bridge.apiGet("search", { kb_ids: kbIds.join(","), q, top_n: topN });
          const results = data.results || [];
          if (!results.length) { setStatus("search-status", "未检索到相关内容。", false); return; }
          setStatus("search-status", `跨 ${kbIds.length} 个知识库检索到 ${results.length} 条：`, true);
          $("results").innerHTML = results.map((r) => {
            const source = (r.metadata && r.metadata.source) || r.document_id;
            const page = r.metadata && r.metadata.page;
            const kbId = (r.metadata && r.metadata.kb_id) || "";
            const score = r.rerank_score != null
              ? `向量 ${r.vector_score.toFixed(4)} / 重排 ${r.rerank_score.toFixed(4)}`
              : `向量 ${r.vector_score.toFixed(4)}`;
            const body = r.content || (r.image_path ? `[图片: ${r.image_path}]` : "（无内容）");
            return `<div class="result-item"><div class="meta">[${esc(kbId)}] [${esc(source)}${page ? ", Page " + page : ""}] · ${esc(score)}</div><div>${esc(body)}</div></div>`;
          }).join("");
        } catch (e) {
          setStatus("search-status", "检索失败: " + e, false);
        }
      }

      // ---------- 配置 ----------
      function isSecret(key) { return /api_key/i.test(key); }

      function renderConfigForm() {
        if (!schema || !groups.length) { $("config-form").textContent = "（未加载）"; return; }
        let html = "";
        for (const group of groups) {
          html += `<fieldset><legend>${esc(GROUP_TITLES[group] || group)}</legend>`;
          for (const key of (groupMembers[group] || [])) {
            const meta = schema[key] || {};
            const type = meta.type || "string";
            const value = configValues[key];
            const desc = meta.description ? `<div class="cfg-desc">${esc(meta.description)}</div>` : "";
            if (type === "bool") {
              html += `<div class="cfg-row"><label>${esc(meta.description || key)}</label>` +
                      `<input type="checkbox" id="cfg_${esc(key)}" ${value ? "checked" : ""}></div>${desc}`;
            } else if (isSecret(key)) {
              html += `<div class="cfg-row"><label>${esc(meta.description || key)}</label>` +
                      `<input type="password" id="cfg_${esc(key)}" value="${esc(value || "")}" autocomplete="off"></div>${desc}`;
            } else if (type === "int") {
              html += `<div class="cfg-row"><label>${esc(meta.description || key)}</label>` +
                      `<input type="number" step="1" id="cfg_${esc(key)}" value="${esc(value == null ? "" : value)}"></div>${desc}`;
            } else {
              html += `<div class="cfg-row"><label>${esc(meta.description || key)}</label>` +
                      `<input type="text" id="cfg_${esc(key)}" value="${esc(value == null ? "" : value)}"></div>${desc}`;
            }
          }
          html += `</fieldset>`;
        }
        $("config-form").innerHTML = html;
      }

      async function loadConfig() {
        setStatus("config-status", "加载配置…");
        try {
          const data = await bridge.apiGet("config");
          schema = data.schema || {};
          groups = data.groups || [];
          groupMembers = data.group_members || {};
          configValues = data.config || {};
          renderConfigForm();
          const cfgTopN = Number(configValues.top_n);
          if (cfgTopN > 0) $("top-n").value = cfgTopN;
          setStatus("config-status", "", true);
        } catch (e) {
          setStatus("config-status", "配置加载失败: " + e, false);
        }
      }

      async function saveConfig() {
        const patch = {};
        for (const key of Object.keys(schema)) {
          const input = document.getElementById("cfg_" + key);
          if (!input) continue;
          const type = (schema[key] || {}).type || "string";
          if (type === "bool") patch[key] = input.checked;
          else if (type === "int" || type === "float") patch[key] = input.value === "" ? null : Number(input.value);
          else patch[key] = input.value;
        }
        setStatus("config-status", "保存中…");
        try {
          const data = await bridge.apiPost("config", patch);
          schema = data.schema || schema;
          groups = data.groups || groups;
          groupMembers = data.group_members || groupMembers;
          configValues = data.config || configValues;
          renderConfigForm();
          setStatus("config-status", "配置已保存。若 Embedding/分块等索引相关配置有变，重建索引将自动触发。", true);
        } catch (e) {
          setStatus("config-status", "保存失败: " + e, false);
        }
      }

      // ---------- 启动 ----------
      async function init() {
        bridge = await waitForBridge();
        const ctx = await bridge.ready();
        document.documentElement.setAttribute("data-theme", ctx.isDark ? "dark" : "light");
        $("btn-kb-create").onclick = createKb;
        $("btn-kb-refresh").onclick = refreshKbs;
        $("btn-search").onclick = search;
        $("btn-config-save").onclick = saveConfig;
        $("query").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
        setupDropzone();
        await refreshKbs();   // 先加载列表，再应用默认选中（避免渲染竞态）
        loadDefaults();
        loadConfig();
      }
      init().catch((e) => {
        setStatus("kb-list", "页面初始化失败: " + e, false);
      });
    })();
  </script>
</body>
</html>
